[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notesmcp"
version = "0.1.0"
description = "MCP Server for Note Management"
authors = [
    { name = "NotesMCP Authors" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.9.2",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/notesmcp"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
